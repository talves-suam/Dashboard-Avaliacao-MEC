<script>
(function () {
  'use strict';

  var INDICADORES = (function () {
    var list = [];
    var i;
    for (i = 1; i <= 24; i++) list.push('1.' + i);
    for (i = 1; i <= 16; i++) list.push('2.' + i);
    for (i = 1; i <= 18; i++) list.push('3.' + i);
    return list;
  })();

  /** Nomes do Instrumento de Avaliação de Cursos de Graduação (Inep, 2017). */
  var INDICADOR_NOMES = {
    '1.1': 'Políticas institucionais no âmbito do curso',
    '1.2': 'Objetivos do curso',
    '1.3': 'Perfil profissional do egresso',
    '1.4': 'Estrutura curricular',
    '1.5': 'Conteúdos curriculares',
    '1.6': 'Metodologia',
    '1.7': 'Estágio curricular supervisionado',
    '1.8': 'Estágio curricular supervisionado – relação com a rede de escolas da educação básica',
    '1.9': 'Estágio curricular supervisionado – relação teoria e prática',
    '1.10': 'Atividades complementares',
    '1.11': 'Trabalhos de Conclusão de Curso (TCC)',
    '1.12': 'Apoio ao discente',
    '1.13': 'Gestão do curso e os processos de avaliação interna e externa',
    '1.14': 'Atividades de tutoria',
    '1.15': 'Conhecimentos, habilidades e atitudes necessárias às atividades de tutoria',
    '1.16': 'Tecnologias de Informação e Comunicação (TIC) no processo ensino-aprendizagem',
    '1.17': 'Ambiente Virtual de Aprendizagem (AVA)',
    '1.18': 'Material didático',
    '1.19': 'Procedimentos de acompanhamento e de avaliação dos processos de ensino-aprendizagem',
    '1.20': 'Número de vagas',
    '1.21': 'Integração com as redes públicas de ensino',
    '1.22': 'Integração do curso com o sistema local e regional de saúde (SUS)',
    '1.23': 'Atividades práticas de ensino para áreas da saúde',
    '1.24': 'Atividades práticas de ensino para licenciaturas',
    '2.1': 'Núcleo Docente Estruturante – NDE',
    '2.2': 'Equipe multidisciplinar',
    '2.3': 'Atuação do coordenador',
    '2.4': 'Regime de trabalho do coordenador de curso',
    '2.5': 'Corpo docente: titulação',
    '2.6': 'Regime de trabalho do corpo docente do curso',
    '2.7': 'Experiência profissional do docente',
    '2.8': 'Experiência no exercício da docência na educação básica',
    '2.9': 'Experiência no exercício da docência superior',
    '2.10': 'Experiência no exercício da docência na educação a distância',
    '2.11': 'Experiência no exercício da tutoria na educação a distância',
    '2.12': 'Atuação do colegiado de curso ou equivalente',
    '2.13': 'Titulação e formação do corpo de tutores do curso',
    '2.14': 'Experiência do corpo de tutores em educação a distância',
    '2.15': 'Interação entre tutores, docentes e coordenadores de curso a distância',
    '2.16': 'Produção científica, cultural, artística ou tecnológica',
    '3.1': 'Espaço de trabalho para docentes em tempo integral',
    '3.2': 'Espaço de trabalho para o coordenador',
    '3.3': 'Sala coletiva de professores',
    '3.4': 'Salas de aula',
    '3.5': 'Acesso dos alunos a equipamentos de informática',
    '3.6': 'Bibliografia básica por Unidade Curricular (UC)',
    '3.7': 'Bibliografia complementar por Unidade Curricular (UC)',
    '3.8': 'Laboratórios didáticos de formação básica',
    '3.9': 'Laboratórios didáticos de formação específica',
    '3.10': 'Laboratórios de ensino para a área de saúde',
    '3.11': 'Laboratórios de habilidades',
    '3.12': 'Unidades hospitalares e complexo assistencial conveniados',
    '3.13': 'Biotérios',
    '3.14': 'Processo de controle de produção ou distribuição de material didático (logística)',
    '3.15': 'Núcleo de práticas jurídicas: atividades básicas e arbitragem, negociação, conciliação, mediação e atividades jurídicas reais',
    '3.16': 'Comitê de Ética em Pesquisa (CEP)',
    '3.17': 'Comitê de Ética na Utilização de Animais (CEUA)',
    '3.18': 'Ambientes profissionais vinculados ao curso'
  };

  var state = {
    cursos: [],
    indicadores: INDICADORES,
    updatedAt: null,
    panel: 'conceito',
    detailMode: false,
    sort: {},
    excelBase64: null,
    excelName: null,
    activeTab: 'excel',
    compareCodes: []
  };

  var el = {
    logo: document.getElementById('navLogo'),
    kpiChart: document.getElementById('kpiChart'),
    chartTitle: document.getElementById('chartTitle'),
    chartSubtitle: document.getElementById('chartSubtitle'),
    chartTotal: document.getElementById('chartTotal'),
    chartAno: document.getElementById('chartAno'),
    vizUnidade: document.getElementById('vizUnidade'),
    vizAto: document.getElementById('vizAto'),
    vizAbaixo3: document.getElementById('vizAbaixo3'),
    topSubtitle: document.getElementById('topSubtitle'),
    lowSubtitle: document.getElementById('lowSubtitle'),
    belowSubtitle: document.getElementById('belowSubtitle'),
    vizRadar: document.getElementById('vizRadar'),
    radarCard: document.getElementById('radarCard'),
    radarSubtitle: document.getElementById('radarSubtitle'),
    vizCompare: document.getElementById('vizCompare'),
    compareCard: document.getElementById('compareCard'),
    compareSubtitle: document.getElementById('compareSubtitle'),
    heatPanel: document.getElementById('heatPanel'),
    dataTable: document.getElementById('dataTable'),
    yearBars: document.getElementById('yearBars'),
    topIndicators: document.getElementById('topIndicators'),
    lowIndicators: document.getElementById('lowIndicators'),
    tableHead: document.getElementById('tableHead'),
    tableBody: document.getElementById('tableBody'),
    tableTitle: document.getElementById('tableTitle'),
    tableSubtitle: document.getElementById('tableSubtitle'),
    panelSwitcher: document.getElementById('panelSwitcher'),
    rowCount: document.getElementById('rowCount'),
    dataStamp: document.getElementById('dataStamp'),
    modal: document.getElementById('modalInclude'),
    loading: document.getElementById('loading'),
    toast: document.getElementById('toast'),
    dropzone: document.getElementById('dropzone'),
    fileExcel: document.getElementById('fileExcel'),
    fileNameLabel: document.getElementById('fileNameLabel'),
    manualIndicadores: document.getElementById('manualIndicadores'),
    filters: {
      cursoCodigo: document.getElementById('fCursoCodigo'),
      unidade: document.getElementById('fUnidade'),
      ano: document.getElementById('fAno'),
      ato: document.getElementById('fAto'),
      faixa: document.getElementById('fFaixa')
    }
  };

  function init() {
    if (typeof LOGO_UNISUAM_B64 !== 'undefined') {
      el.logo.src = 'data:image/png;base64,' + LOGO_UNISUAM_B64;
    }
    buildManualIndicatorFields();
    bindEvents();
    loadData();
  }

  function bindEvents() {
    document.getElementById('btnIncludeCourse').addEventListener('click', openModal);
    document.getElementById('btnCloseModal').addEventListener('click', closeModal);
    document.getElementById('btnCancelModal').addEventListener('click', closeModal);
    document.getElementById('btnSaveModal').addEventListener('click', saveModal);
    document.getElementById('btnClearFilters').addEventListener('click', clearFilters);
    document.getElementById('btnCompareCourses').addEventListener('click', openCompareModal);
    document.getElementById('btnCloseCompare').addEventListener('click', closeCompareModal);
    document.getElementById('btnAddCompare').addEventListener('click', addCompareSlot);
    document.getElementById('btnConfirmCompare').addEventListener('click', confirmCompare);
    document.getElementById('btnEndCompare').addEventListener('click', endCompare);
    document.getElementById('modalCompare').addEventListener('click', function (e) {
      if (e.target === document.getElementById('modalCompare')) closeCompareModal();
    });
    document.getElementById('btnClearData').addEventListener('click', clearAllData);
    document.getElementById('btnCloseKpiModal').addEventListener('click', closeKpiModal);
    document.getElementById('btnCloseKpiModal2').addEventListener('click', closeKpiModal);
    document.getElementById('modalKpi').addEventListener('click', function (e) {
      if (e.target === document.getElementById('modalKpi')) closeKpiModal();
    });

    el.filters.cursoCodigo.addEventListener('change', onCourseFilterChanged);
    el.filters.unidade.addEventListener('change', onUnidadeFilterChanged);
    Object.keys(el.filters).forEach(function (key) {
      if (key === 'cursoCodigo' || key === 'unidade') return;
      el.filters[key].addEventListener('change', onFiltersChanged);
    });
    if (el.chartAno) {
      el.chartAno.addEventListener('change', function () {
        renderConceptChart();
      });
    }

    el.panelSwitcher.addEventListener('click', function (ev) {
      var btn = ev.target.closest('button[data-panel]');
      if (!btn || btn.disabled) return;
      setPanel(btn.getAttribute('data-panel'));
    });

    document.querySelectorAll('.tabs button[data-tab]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        setModalTab(btn.getAttribute('data-tab'));
      });
    });

    el.fileExcel.addEventListener('change', function () {
      var file = el.fileExcel.files && el.fileExcel.files[0];
      if (file) readExcelFile(file);
    });

    ['dragenter', 'dragover'].forEach(function (evt) {
      el.dropzone.addEventListener(evt, function (e) {
        e.preventDefault();
        el.dropzone.classList.add('dragover');
      });
    });
    ['dragleave', 'drop'].forEach(function (evt) {
      el.dropzone.addEventListener(evt, function (e) {
        e.preventDefault();
        el.dropzone.classList.remove('dragover');
      });
    });
    el.dropzone.addEventListener('drop', function (e) {
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) readExcelFile(file);
    });

    el.modal.addEventListener('click', function (e) {
      if (e.target === el.modal) closeModal();
    });
  }

  function buildManualIndicatorFields() {
    el.manualIndicadores.innerHTML = INDICADORES.map(function (ind) {
      return '<div class="field"><label for="ind_' + ind.replace('.', '_') + '">' + ind + '</label>' +
        '<input type="number" min="0" max="5" step="0.1" id="ind_' + ind.replace('.', '_') + '" data-ind="' + ind + '"></div>';
    }).join('');
  }

  function setLoading(on) {
    el.loading.classList.toggle('open', !!on);
  }

  function toast(msg, type) {
    el.toast.textContent = msg;
    el.toast.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () {
      el.toast.classList.remove('show');
    }, 3800);
  }

  function loadData() {
    setLoading(true);
    google.script.run
      .withSuccessHandler(function (res) {
        setLoading(false);
        if (!res || !res.ok) {
          toast((res && res.error) || 'Falha ao carregar dados.', 'error');
          return;
        }
        state.cursos = prepareCursos((res.data && res.data.cursos) || []);
        state.updatedAt = res.data && res.data.updatedAt;
        if (res.indicadores && res.indicadores.length) state.indicadores = res.indicadores;
        populateFilterOptions();
        renderAll();
        var cleanup = [];
        if (res.removedDuplicates > 0) cleanup.push(res.removedDuplicates + ' registro(s) duplicado(s) foram excluídos.');
        if (res.removedSparse > 0) cleanup.push(res.removedSparse + ' curso(s) com menos de 10 notas foram removidos.');
        if (cleanup.length) toast(cleanup.join(' '), 'success');
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        toast(String(err), 'error');
      })
      .getDashboardData();
  }

  var UNIDADE_NOMES = {
    BG: 'Bangu',
    BS: 'Bonsucesso',
    CG: 'Campo Grande'
  };

  function foldText(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase()
      .trim();
  }

  function normalizeUnidadeCodigo(raw) {
    var text = String(raw == null ? '' : raw).trim();
    if (!text) return '';
    var key = foldText(text).replace(/[^a-z0-9]+/g, '');
    if (key === 'bg' || key.indexOf('bangu') >= 0) return 'BG';
    if (key === 'bs' || key.indexOf('bonsucesso') >= 0) return 'BS';
    if (key === 'cg' || key.indexOf('campogrande') >= 0) return 'CG';
    if (key === 'ead' || key.indexOf('distancia') >= 0) return 'EAD';
    return text.toUpperCase();
  }

  function normalizeAto(raw) {
    var text = String(raw == null ? '' : raw).trim().replace(/\s+/g, ' ');
    if (!text) return '';
    var key = foldText(text);
    if (key.indexOf('autoriz') === 0) return 'Autorização';
    if (key.indexOf('reconhec') === 0) return 'Reconhecimento';
    if (key.indexOf('renov') === 0) return 'Renovação';
    return text;
  }

  function unidadeLabel(u) {
    var code = normalizeUnidadeCodigo(u);
    if (!code) return '';
    return UNIDADE_NOMES[code] || code;
  }

  function compareCursos(a, b) {
    var byName = String(a.curso || '').localeCompare(String(b.curso || ''), 'pt-BR', { sensitivity: 'base' });
    if (byName) return byName;
    var byYear = Number(a.anoVisita) - Number(b.anoVisita);
    if (byYear) return byYear;
    return unidadeLabel(a.unidade).localeCompare(unidadeLabel(b.unidade), 'pt-BR', { sensitivity: 'base' });
  }

  function prepareCursos(list) {
    return keepScoredCursos(list).map(function (c) {
      c.curso = String(c.curso || '').trim();
      c.unidade = normalizeUnidadeCodigo(c.unidade);
      c.atoRegulatorio = normalizeAto(c.atoRegulatorio);
      return c;
    }).sort(compareCursos);
  }

  function uniqueSorted(arr, numeric) {
    var map = {};
    arr.forEach(function (v) {
      if (v === null || v === undefined || v === '') return;
      map[String(v)] = v;
    });
    var keys = Object.keys(map);
    keys.sort(function (a, b) {
      if (numeric) return Number(a) - Number(b);
      return a.localeCompare(b, 'pt-BR', { sensitivity: 'base' });
    });
    return keys.map(function (k) { return map[k]; });
  }

  function fillSelect(select, values, allLabel, keepValue) {
    var current = keepValue ? select.value : '';
    select.innerHTML = '<option value="">' + allLabel + '</option>' +
      values.map(function (v) {
        return '<option value="' + escapeAttr(String(v)) + '">' + escapeHtml(String(v)) + '</option>';
      }).join('');
    var stillThere = current && values.some(function (v) { return String(v) === String(current); });
    select.value = stillThere ? String(current) : '';
  }

  function fillUnidadeSelect(select, values, keepValue) {
    var current = keepValue ? select.value : '';
    var sorted = values.slice().sort(function (a, b) {
      return unidadeLabel(a).localeCompare(unidadeLabel(b), 'pt-BR', { sensitivity: 'base' });
    });
    select.innerHTML = '<option value="">Todas</option>' +
      sorted.map(function (v) {
        return '<option value="' + escapeAttr(String(v)) + '">' + escapeHtml(unidadeLabel(v)) + '</option>';
      }).join('');
    if (current && sorted.some(function (v) { return String(v) === current; })) {
      select.value = current;
    } else if (!keepValue) {
      select.value = '';
    }
  }

  function courseFilterOptions() {
    var byCode = {};
    state.cursos.forEach(function (c) {
      if (c.codigo == null || c.codigo === '') return;
      var code = String(c.codigo);
      if (!byCode[code]) {
        byCode[code] = {
          value: code,
          name: String(c.curso || '').trim(),
          unidade: String(c.unidade || '').trim()
        };
      }
    });
    return Object.keys(byCode).map(function (code) {
      var item = byCode[code];
      return {
        value: item.value,
        name: item.name,
        unidade: item.unidade,
        label: item.name ? (item.name + ' — ' + item.value) : item.value
      };
    }).sort(function (a, b) {
      var byName = a.name.localeCompare(b.name, 'pt-BR', { sensitivity: 'base' });
      if (byName !== 0) return byName;
      return a.value.localeCompare(b.value, 'pt-BR', { numeric: true });
    });
  }

  function fillCourseFilter(select, options, keepValue) {
    var current = keepValue ? select.value : '';
    select.innerHTML = '<option value="">Todos</option>' +
      options.map(function (opt) {
        return '<option value="' + escapeAttr(opt.value) + '" data-unidade="' + escapeAttr(opt.unidade || '') + '">' +
          escapeHtml(opt.label) + '</option>';
      }).join('');
    if (current && options.some(function (opt) { return opt.value === current; })) {
      select.value = current;
    }
  }

  function cursosForSelectedCourse() {
    var code = el.filters.cursoCodigo.value;
    if (!code) return state.cursos;
    var unidade = el.filters.unidade.value;
    return state.cursos.filter(function (c) {
      if (String(c.codigo) !== code) return false;
      if (unidade && String(c.unidade) !== unidade) return false;
      return true;
    });
  }

  function unitsForCourse(code) {
    var seen = {};
    var units = [];
    state.cursos.forEach(function (c) {
      if (code && String(c.codigo) !== code) return;
      var unidade = normalizeUnidadeCodigo(c.unidade);
      if (!unidade || seen[unidade]) return;
      seen[unidade] = true;
      units.push(unidade);
    });
    units.sort(function (a, b) {
      return unidadeLabel(a).localeCompare(unidadeLabel(b), 'pt-BR', { sensitivity: 'base' });
    });
    return units;
  }

  function refreshYearAndAtoFilters(keepValues) {
    var subset = cursosForSelectedCourse();
    fillSelect(el.filters.ano, uniqueSorted(subset.map(function (c) { return c.anoVisita; }), true), 'Todos', keepValues);
    fillSelect(el.filters.ato, uniqueSorted(subset.map(function (c) { return c.atoRegulatorio; })), 'Todos', keepValues);
  }

  function populateFilterOptions() {
    var cursos = state.cursos;
    fillCourseFilter(el.filters.cursoCodigo, courseFilterOptions(), true);
    fillUnidadeSelect(el.filters.unidade, uniqueSorted(cursos.map(function (c) { return c.unidade; })), true);
    refreshYearAndAtoFilters(true);
    if (el.chartAno) {
      fillSelect(el.chartAno, uniqueSorted(cursos.map(function (c) { return c.anoVisita; }), true), 'Todos os anos', true);
    }
    fillSelect(el.filters.faixa, uniqueSorted(cursos.map(function (c) { return c.conceitoFinalFaixa; }), true), 'Todos', true);
  }

  function onCourseFilterChanged() {
    var code = el.filters.cursoCodigo.value;
    var units = code ? unitsForCourse(code) : unitsForCourse('');
    fillUnidadeSelect(el.filters.unidade, units, false);
    el.filters.unidade.value = code && units.length ? units[0] : '';
    el.filters.ano.value = '';
    el.filters.ato.value = '';
    refreshYearAndAtoFilters(false);
    onFiltersChanged();
  }

  function onUnidadeFilterChanged() {
    if (el.filters.cursoCodigo.value) refreshYearAndAtoFilters(true);
    onFiltersChanged();
  }

  function getFilters() {
    return {
      cursoCodigo: el.filters.cursoCodigo.value,
      unidade: el.filters.unidade.value,
      ano: el.filters.ano.value,
      ato: el.filters.ato.value,
      faixa: el.filters.faixa.value
    };
  }

  function filteredCursos() {
    var f = getFilters();
    return state.cursos.filter(function (c) {
      if (!matchesCompare(c)) return false;
      if (f.cursoCodigo && String(c.codigo) !== f.cursoCodigo) return false;
      if (f.unidade && String(c.unidade) !== f.unidade) return false;
      if (f.ano && String(c.anoVisita) !== f.ano) return false;
      if (f.ato && String(c.atoRegulatorio) !== f.ato) return false;
      if (f.faixa && String(c.conceitoFinalFaixa) !== f.faixa) return false;
      return true;
    });
  }

  function isDetailMode(filters) {
    return !!filters.cursoCodigo;
  }

  /** Recorte do gráfico: ignora o curso selecionado para manter a visão geral. */
  function chartCursos() {
    var f = getFilters();
    return state.cursos.filter(function (c) {
      if (!matchesCompare(c)) return false;
      if (f.unidade && String(c.unidade) !== f.unidade) return false;
      if (f.ano && String(c.anoVisita) !== f.ano) return false;
      if (f.ato && String(c.atoRegulatorio) !== f.ato) return false;
      return true;
    });
  }

  function onFiltersChanged() {
    var f = getFilters();
    var wasDetail = state.detailMode;
    state.detailMode = isDetailMode(f);
    if (state.detailMode && !wasDetail && state.panel !== 'calor') {
      state.panel = 'indicadores';
    } else if (!state.detailMode && wasDetail && state.panel === 'indicadores') {
      state.panel = 'conceito';
    }
    renderAll();
  }

  var compareSlotCount = 0;

  function compareOptionsHtml() {
    return '<option value="">Selecione</option>' + courseFilterOptions().map(function (item) {
      return '<option value="' + escapeAttr(item.value) + '">' + escapeHtml(item.label) + '</option>';
    }).join('');
  }

  function addCompareSlot() {
    compareSlotCount += 1;
    var slot = document.createElement('div');
    slot.className = 'field compare-slot';
    slot.innerHTML = '<label>Curso ' + compareSlotCount + '</label><select>' + compareOptionsHtml() + '</select>';
    document.getElementById('compareSlots').appendChild(slot);
  }

  function matchesCompare(c) {
    return !state.compareCodes.length || state.compareCodes.indexOf(String(c.codigo)) >= 0;
  }

  function renderCompareBanner() {
    var banner = document.getElementById('compareBanner');
    var list = document.getElementById('compareBannerList');
    if (!banner || !list) return;
    if (!state.compareCodes.length) {
      banner.hidden = true;
      list.innerHTML = '';
      return;
    }
    var options = courseFilterOptions();
    banner.hidden = false;
    list.innerHTML = state.compareCodes.map(function (code) {
      var found = null;
      options.forEach(function (item) { if (item.value === code) found = item; });
      return '<span class="compare-chip">' + escapeHtml(found ? found.label : code) + '</span>';
    }).join('');
  }

  function openCompareModal() {
    compareSlotCount = 0;
    document.getElementById('compareSlots').innerHTML = '';
    document.getElementById('compareHint').textContent = '';
    var saved = state.compareCodes.slice();
    var total = Math.max(2, saved.length);
    var i;
    for (i = 0; i < total; i++) addCompareSlot();
    var selects = document.querySelectorAll('#compareSlots select');
    saved.forEach(function (code, index) {
      if (selects[index]) selects[index].value = code;
    });
    document.getElementById('modalCompare').classList.add('open');
  }

  function confirmCompare() {
    var codes = [];
    document.querySelectorAll('#compareSlots select').forEach(function (sel) {
      if (sel.value && codes.indexOf(sel.value) < 0) codes.push(sel.value);
    });
    var hint = document.getElementById('compareHint');
    if (codes.length < 2) {
      hint.textContent = 'Escolha pelo menos dois cursos diferentes.';
      return;
    }
    state.compareCodes = codes;
    el.filters.cursoCodigo.value = '';
    el.filters.unidade.value = '';
    fillUnidadeSelect(el.filters.unidade, unitsForCourse(''), false);
    refreshYearAndAtoFilters(false);
    closeCompareModal();
    onFiltersChanged();
  }

  function endCompare() {
    state.compareCodes = [];
    renderAll();
  }

  function closeCompareModal() {
    document.getElementById('modalCompare').classList.remove('open');
  }

  function clearFilters() {
    Object.keys(el.filters).forEach(function (k) { el.filters[k].value = ''; });
    fillUnidadeSelect(el.filters.unidade, unitsForCourse(''), false);
    refreshYearAndAtoFilters(false);
    state.detailMode = false;
    state.panel = 'conceito';
    state.compareCodes = [];
    renderAll();
  }

  function setPanel(panel) {
    if (state.detailMode && panel !== 'indicadores' && panel !== 'calor') return;
    state.panel = panel;
    renderTable(filteredCursos());
    updatePanelSwitcher();
  }

  function updatePanelSwitcher() {
    var buttons = el.panelSwitcher.querySelectorAll('button[data-panel]');
    buttons.forEach(function (btn) {
      var panel = btn.getAttribute('data-panel');
      btn.classList.toggle('active', panel === state.panel);
      btn.disabled = state.detailMode && panel !== 'indicadores' && panel !== 'calor';
    });
    var titles = {
      conceito: ['Painel Conceito', 'Visão geral dos cursos avaliados'],
      indicadores: ['Painel de Indicadores', 'Notas por indicador. Passe o mouse no código da coluna para ver o nome.'],
      detalhes: ['Painel de Detalhes', 'Distribuição de indicadores < 3 e ≥ 3 (geral, com CC e por ano)'],
      calor: ['Mapa de calor', 'Nota de cada indicador por curso. Passe o mouse na célula para ver o nome.']
    };
    if (state.detailMode && state.panel === 'indicadores') {
      el.tableTitle.textContent = 'Painel de Indicadores';
      el.tableSubtitle.textContent = 'Indicadores do curso selecionado';
    } else {
      var t = titles[state.panel] || titles.conceito;
      el.tableTitle.textContent = t[0];
      el.tableSubtitle.textContent = t[1];
    }
  }

  function renderAll() {
    var f = getFilters();
    state.detailMode = isDetailMode(f);
    if (state.detailMode && state.panel !== 'indicadores' && state.panel !== 'calor') {
      state.panel = 'indicadores';
    }
    var rows = filteredCursos();
    renderCompareBanner();
    renderConceptChart();
    renderInsights();
    renderYearBars(rows);
    renderIndicatorExtremes(rows);
    updatePanelSwitcher();
    renderTable(rows);
    el.rowCount.textContent = rows.length + (rows.length === 1 ? ' registro' : ' registros');
    el.dataStamp.textContent = state.updatedAt
      ? 'Atualizado em ' + formatDate(state.updatedAt)
      : 'Base local · ' + state.cursos.length + ' cursos';
  }

  function faixaTone(v) {
    var n = toNum(v);
    if (n === 5) return 'tone-5';
    if (n === 4) return 'tone-4';
    return 'tone-low';
  }

  function courseRowKey(c) {
    return [String(c.codigo), String(c.anoVisita), String(c.unidade || '')].join('|');
  }

  function renderCourseScores(rows) {
    var list = rows.slice().sort(function (a, b) { return Number(b.anoVisita) - Number(a.anoVisita); });
    var name = list.length ? (list[0].curso || 'Curso') : 'Curso';
    if (el.chartTitle) el.chartTitle.textContent = name;
    el.chartSubtitle.textContent = list.length > 1
      ? 'Conceito final contínuo e faixa de cada avaliação deste curso.'
      : 'Conceito final contínuo e faixa do curso selecionado.';
    el.chartTotal.textContent = '';
    if (!list.length) {
      el.kpiChart.innerHTML = '<p class="empty-soft">Sem avaliação para o recorte deste curso.</p>';
      return;
    }
    el.kpiChart.innerHTML = list.map(function (c) {
      var faixa = toNum(c.conceitoFinalFaixa);
      var hint = [unidadeLabel(c.unidade), c.anoVisita, c.atoRegulatorio].filter(function (v) {
        return v != null && v !== '';
      }).join(' · ');
      return '<div class="kpi-row cols-2 score-pair">' +
        '<article class="kpi-card tone-accent">' +
        '<p class="kpi-label">Conceito final contínuo</p>' +
        '<p class="kpi-value">' + formatScore(c.conceitoFinalContinuo) + '</p>' +
        '<p class="kpi-hint">' + escapeHtml(hint) + '</p></article>' +
        '<article class="kpi-card tone-focus">' +
        '<p class="kpi-label">Conceito final faixa</p>' +
        '<p class="kpi-value">' + (faixa == null ? '—' : escapeHtml(String(faixa))) + '</p>' +
        '<p class="kpi-hint">' + escapeHtml(hint) + '</p></article></div>';
    }).join('');
  }

  function renderConceptChart() {
    var selected = getFilters().cursoCodigo;
    var panel = el.kpiChart.closest('.chart-panel');
    if (selected) {
      if (panel) panel.classList.add('is-course');
      renderCourseScores(filteredCursos());
      return;
    }
    if (panel) panel.classList.remove('is-course');
    if (el.chartTitle) el.chartTitle.textContent = state.compareCodes.length ? 'Comparando cursos' : 'Notas dos cursos';
    var year = el.chartAno ? el.chartAno.value : '';
    var rows = state.cursos.filter(function (c) {
      if (!matchesCompare(c)) return false;
      return !year || String(c.anoVisita) === year;
    });
    state.chartRows = rows;
    var scored = rows.filter(function (c) { return toNum(c.conceitoFinalFaixa) != null; });
    scored.sort(function (a, b) {
      var byYear = Number(a.anoVisita) - Number(b.anoVisita);
      if (byYear) return byYear;
      var faixa = toNum(a.conceitoFinalFaixa) - toNum(b.conceitoFinalFaixa);
      if (faixa) return faixa;
      var ca = toNum(a.conceitoFinalContinuo);
      var cb = toNum(b.conceitoFinalContinuo);
      if (ca != null && cb != null && ca !== cb) return ca - cb;
      return String(a.curso || '').localeCompare(String(b.curso || ''), 'pt-BR', { sensitivity: 'base' });
    });

    var yearLabel = year ? 'Ano da visita ' + year : 'Todos os anos, agrupados pela visita';
    el.chartSubtitle.textContent = yearLabel + ', da menor nota para a maior. Passe o mouse para ver o nome completo.';
    var missing = rows.length - scored.length;
    el.chartTotal.textContent = scored.length
      ? scored.length + (scored.length === 1 ? ' curso com nota' : ' cursos com nota') +
        (missing ? ' · ' + missing + ' sem nota' : '')
      : 'Sem nota informada';

    if (!scored.length) {
      el.kpiChart.innerHTML = '<p class="empty-soft">' +
        (year ? 'Sem conceitos em ' + escapeHtml(year) + '.' : 'Sem conceitos na base. Importe a planilha com valores.') +
        '</p>';
      return;
    }

    var groups = [];
    scored.forEach(function (c) {
      var y = String(c.anoVisita == null || c.anoVisita === '' ? '—' : c.anoVisita);
      if (!groups.length || groups[groups.length - 1].year !== y) groups.push({ year: y, items: [] });
      groups[groups.length - 1].items.push(c);
    });
    var showYears = groups.length > 1;

    var scale = '<div class="course-scale" aria-hidden="true"><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span><span>0</span></div>';
    var cols = groups.map(function (group) {
      var mark = showYears
        ? '<div class="course-year-mark" aria-hidden="true"><span>' + escapeHtml(group.year) + '</span></div>'
        : '';
      return mark + group.items.map(function (c) {
      var nota = toNum(c.conceitoFinalFaixa);
      var h = Math.max(8, Math.round((nota / 5) * 100));
      var on = selected && String(c.codigo) === selected ? ' is-on' : '';
      var meta = [unidadeLabel(c.unidade), c.anoVisita].filter(function (v) { return v != null && v !== ''; }).join(' · ');
      var label = c.curso || 'Curso';
      var short = abbreviateCourse(label);
      var tip = label + (meta ? ' · ' + meta : '') + ' · nota ' + nota;
      if (toNum(c.conceitoFinalContinuo) != null) tip += ' · contínuo ' + formatScore(c.conceitoFinalContinuo);
      return '<button type="button" class="course-col ' + faixaTone(nota) + on + '" data-key="' + escapeAttr(courseRowKey(c)) + '" title="' + escapeAttr(tip) + '">' +
        '<span class="course-bar">' +
        '<span class="course-score">' + escapeHtml(String(nota)) + '</span>' +
        '<span class="course-track" aria-hidden="true"><span class="course-fill" style="height:' + h + '%"></span></span>' +
        '</span>' +
        '<span class="course-name"><strong>' + escapeHtml(short) + '</strong>' +
        (meta ? '<span>' + escapeHtml(meta) + '</span>' : '') + '</span>' +
        '</button>';
      }).join('');
    }).join('');
    el.kpiChart.innerHTML = '<div class="course-h">' + scale + '<div class="course-cols">' + cols + '</div></div>';
    var colsWrap = el.kpiChart.querySelector('.course-cols');
    if (year && colsWrap && colsWrap.scrollWidth <= colsWrap.clientWidth + 2) {
      colsWrap.classList.add('is-centered');
    }

    el.kpiChart.querySelectorAll('.course-col').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var key = btn.getAttribute('data-key');
        var found = state.chartRows.filter(function (c) { return courseRowKey(c) === key; });
        if (!found.length) return;
        var c = found[0];
        showCoursesModal(c.curso || 'Curso', (unidadeLabel(c.unidade) || '—') + ' · ' + (c.anoVisita || '—') + ' · nota ' + (c.conceitoFinalFaixa == null ? '—' : c.conceitoFinalFaixa), found);
      });
    });
  }

  function renderInsights() {
    var rows = chartCursos();
    renderUnitChart(rows);
    renderAtoChart(rows);
    renderBelow3Chart(rows);
    renderRadar(filteredCursos());
  }

  function scoreBands(list) {
    var scored = list.filter(function (c) { return toNum(c.conceitoFinalFaixa) != null; });
    return {
      total: scored.length,
      n5: scored.filter(function (c) { return toNum(c.conceitoFinalFaixa) === 5; }).length,
      n4: scored.filter(function (c) { return toNum(c.conceitoFinalFaixa) === 4; }).length,
      nLow: scored.filter(function (c) {
        var v = toNum(c.conceitoFinalFaixa);
        return v != null && v < 4;
      }).length
    };
  }

  function stackedBar(label, bands, extra) {
    if (!bands.total) {
      return '<div class="stack-row"><span class="stack-label">' + escapeHtml(label) + '</span>' +
        '<span class="stack-empty">Sem nota</span></div>';
    }
    function seg(n, tone, name) {
      if (!n) return '';
      var w = (n / bands.total) * 100;
      return '<span class="stack-seg ' + tone + '" style="width:' + w + '%" title="' + escapeAttr(name + ': ' + n) + '">' +
        (w >= 12 ? n : '') + '</span>';
    }
    return '<div class="stack-row"><span class="stack-label">' + escapeHtml(label) + '</span>' +
      '<span class="stack-track">' +
      seg(bands.n5, 'tone-5', 'Nota 5') +
      seg(bands.n4, 'tone-4', 'Nota 4') +
      seg(bands.nLow, 'tone-low', 'Nota < 4') +
      '</span><span class="stack-meta">' + bands.total +
      (extra ? '<span>' + escapeHtml(extra) + '</span>' : '') +
      '</span></div>';
  }

  function renderUnitChart(rows) {
    var units = uniqueSorted(rows.map(function (c) { return c.unidade; }));
    if (!units.length) {
      el.vizUnidade.innerHTML = '<p class="empty-soft">Sem unidades no recorte.</p>';
      return;
    }
    el.vizUnidade.innerHTML = units.map(function (u) {
      var subset = rows.filter(function (c) { return String(c.unidade) === String(u); });
      return stackedBar(unidadeLabel(u), scoreBands(subset));
    }).join('');
  }

  function isAutorizacao(ato) {
    var s = String(ato || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
    return s.indexOf('autoriz') === 0;
  }

  function renderAtoChart(rows) {
    var atos = uniqueSorted(rows.map(function (c) { return c.atoRegulatorio; }))
      .filter(function (ato) { return !isAutorizacao(ato); });
    if (!atos.length) {
      el.vizAto.innerHTML = '<p class="empty-soft">Sem atos no recorte.</p>';
      return;
    }
    el.vizAto.innerHTML = atos.map(function (ato) {
      var subset = rows.filter(function (c) { return String(c.atoRegulatorio) === String(ato); });
      var bands = scoreBands(subset);
      var medio = avg(subset.map(function (c) { return c.conceitoFinalContinuo; }));
      var extra = medio == null ? '' : 'média ' + formatScore(medio);
      return stackedBar(String(ato), bands, extra);
    }).join('');
  }

  function renderBelow3Chart(rows) {
    if (getFilters().cursoCodigo) {
      renderCourseBelow3(filteredCursos());
      return;
    }
    if (el.belowSubtitle) el.belowSubtitle.textContent = 'Os indicadores com mais cursos abaixo da nota 3.';
    var items = INDICADORES.map(function (ind) {
      var scored = 0;
      var low = 0;
      rows.forEach(function (c) {
        var v = toNum((c.indicadores || {})[ind]);
        if (v == null) return;
        scored++;
        if (v < 3) low++;
      });
      return {
        ind: ind,
        low: low,
        scored: scored,
        pct: scored ? (low / scored) * 100 : 0
      };
    }).filter(function (x) { return x.low > 0; });
    items.sort(function (a, b) { return b.pct - a.pct || b.low - a.low || indicatorSort(a.ind, b.ind); });
    items = items.slice(0, 12);
    el.vizAbaixo3.innerHTML = items.length
      ? scoreBarList(items.map(function (x) {
          return { ind: x.ind, value: x.pct, meta: x.low + ' · ' + formatPct(x.pct) };
        }))
      : '<p class="empty-soft">Nenhum indicador abaixo de 3 neste recorte.</p>';
  }

  function scoreBarList(items) {
    var max = 0;
    items.forEach(function (x) { if (x.value > max) max = x.value; });
    return items.map(function (x) {
      var w = max ? Math.max(4, Math.round((x.value / max) * 100)) : 0;
      var name = indicatorName(x.ind);
      return '<div class="low3-row" title="' + escapeAttr(name ? x.ind + ' — ' + name : x.ind) + '">' +
        '<span class="low3-name"><strong>' + escapeHtml(x.ind) + '</strong>' +
        (name ? '<span>' + escapeHtml(name) + '</span>' : '') + '</span>' +
        '<span class="low3-track"><span class="low3-fill" style="width:' + w + '%"></span></span>' +
        '<span class="low3-meta">' + x.meta + '</span></div>';
    }).join('');
  }

  function dimensionMeans(rows, dim) {
    var means = [];
    rows.forEach(function (c) {
      var vals = [];
      INDICADORES.forEach(function (ind) {
        if (ind.charAt(0) !== dim) return;
        var v = toNum((c.indicadores || {})[ind]);
        if (v != null) vals.push(v);
      });
      if (vals.length) means.push(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length);
    });
    return means;
  }

  function numberPack(nums) {
    if (!nums.length) return { max: null, avg: null, min: null };
    var max = nums[0];
    var min = nums[0];
    var sum = 0;
    nums.forEach(function (n) {
      sum += n;
      if (n > max) max = n;
      if (n < min) min = n;
    });
    return { max: max, avg: sum / nums.length, min: min };
  }

  function fieldNums(rows, field) {
    return rows.map(function (c) { return toNum(c[field]); }).filter(function (v) { return v != null; });
  }

  function meanOf(nums) {
    if (!nums.length) return null;
    return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
  }

  function formatStat(n) {
    return n == null ? '—' : formatScore(n);
  }

  function metricCard(title, pack, courseText) {
    var rows = [
      ['Nota mais alta', formatStat(pack.max)],
      ['Média geral', formatStat(pack.avg)],
      ['Nota mais baixa', formatStat(pack.min)],
      ['Curso', courseText == null ? '—' : courseText]
    ];
    return '<article class="radar-score"><h3>' + escapeHtml(title) + '</h3>' +
      rows.map(function (row, i) {
        var tone = i === 3 ? 'is-curso' : 'is-geral';
        return '<p><span>' + row[0] + '</span><strong class="' + tone + '">' + row[1] + '</strong></p>';
      }).join('') +
      '</article>';
  }

  function renderRadar(selectedRows) {
    if (!getFilters().cursoCodigo) {
      el.radarCard.hidden = true;
      el.compareCard.hidden = true;
      return;
    }
    el.radarCard.hidden = false;
    el.compareCard.hidden = false;
    var name = (selectedRows[0] && selectedRows[0].curso) || 'Curso selecionado';
    var benchmark = state.cursos;
    var dims = [
      { id: '1', label: 'Organização' },
      { id: '2', label: 'Corpo docente' },
      { id: '3', label: 'Infraestrutura' }
    ];
    el.radarSubtitle.textContent = name + ' comparado a todos os cursos.';
    el.vizRadar.innerHTML = dims.map(function (d) {
      var courseMean = meanOf(dimensionMeans(selectedRows, d.id));
      return metricCard(d.label, numberPack(dimensionMeans(benchmark, d.id)), formatStat(courseMean));
    }).join('');

    var several = selectedRows.length > 1;
    el.compareSubtitle.textContent = several
      ? 'Média das avaliações de ' + name + ' diante de todos os cursos.'
      : name + ' diante de todos os cursos.';
    el.vizCompare.innerHTML = [
      { title: 'Contínuo', field: 'conceitoFinalContinuo' },
      { title: 'Faixa', field: 'conceitoFinalFaixa' }
    ].map(function (item) {
      var courseNums = fieldNums(selectedRows, item.field);
      var course = meanOf(courseNums);
      var courseText = formatStat(course);
      if (item.field === 'conceitoFinalFaixa' && courseNums.length === 1) courseText = String(courseNums[0]);
      return metricCard(item.title, numberPack(fieldNums(benchmark, item.field)), courseText);
    }).join('');
  }

  function heatClass(v) {
    if (v == null) return 'heat-empty';
    if (v >= 5) return 'heat-5';
    if (v >= 4) return 'heat-4';
    if (v >= 3) return 'heat-3';
    return 'heat-low';
  }

  function renderHeatmap(rows) {
    var list = rows.filter(function (c) {
      return INDICADORES.some(function (ind) { return toNum((c.indicadores || {})[ind]) != null; });
    });
    if (!list.length) {
      el.heatPanel.innerHTML = '<p class="empty-soft">Sem notas de indicadores para o mapa.</p>';
      return;
    }
    list.sort(function (a, b) {
      var name = String(a.curso || '').localeCompare(String(b.curso || ''), 'pt-BR', { sensitivity: 'base' });
      if (name) return name;
      return Number(a.anoVisita) - Number(b.anoVisita);
    });
    var head = '<tr><th class="heat-sticky">Curso</th>' + INDICADORES.map(function (ind) {
      var name = indicatorName(ind);
      return '<th title="' + escapeAttr(name ? ind + ' — ' + name : ind) + '">' + escapeHtml(ind) + '</th>';
    }).join('') + '</tr>';
    var body = list.map(function (c) {
      var meta = [unidadeLabel(c.unidade), c.anoVisita].filter(function (v) { return v != null && v !== ''; }).join(' · ');
      var cells = '<th class="heat-sticky" data-value="' + escapeAttr(c.curso || '') + '" title="' + escapeAttr((c.curso || '') + (meta ? ' · ' + meta : '')) + '">' +
        '<strong>' + escapeHtml(c.curso || '—') + '</strong>' +
        (meta ? '<span>' + escapeHtml(meta) + '</span>' : '') + '</th>';
      INDICADORES.forEach(function (ind) {
        var v = toNum((c.indicadores || {})[ind]);
        var name = indicatorName(ind);
        var tip = (c.curso || '') + ' · ' + ind + (name ? ' ' + name : '') + ' · ' + (v == null ? 'sem nota' : formatScore(v));
        cells += '<td class="' + heatClass(v) + '" data-value="' + escapeAttr(v == null ? '' : String(v)) + '" title="' + escapeAttr(tip) + '">' +
          (v == null ? '' : escapeHtml(String(v))) + '</td>';
      });
      return '<tr>' + cells + '</tr>';
    }).join('');
    el.heatPanel.innerHTML = '<div class="heat-scroll"><table class="heat-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>';
    bindTableSort(el.heatPanel.querySelector('table'), 'calor');
  }

  function showCoursesModal(title, subtitle, list) {
    document.getElementById('kpiModalTitle').textContent = title;
    document.getElementById('kpiModalSubtitle').textContent = subtitle;
    document.getElementById('kpiModalHead').innerHTML =
      '<tr>' + th('Código') + th('Curso') + th('Unidade') + th('Ano Visita') +
      th('Ato Regulatório') + th('Conceito Contínuo') + th('Conceito Faixa') + '</tr>';

    var body = document.getElementById('kpiModalBody');
    if (!list.length) {
      body.innerHTML = emptyRow(7);
    } else {
      body.innerHTML = list.map(function (c) {
        return '<tr>' +
          td(escapeHtml(c.codigo), 'num') +
          td(escapeHtml(c.curso)) +
          td(escapeHtml(unidadeLabel(c.unidade))) +
          td(escapeHtml(c.anoVisita), 'num') +
          td(escapeHtml(c.atoRegulatorio)) +
          td(formatScore(c.conceitoFinalContinuo), 'num') +
          td(faixaBadge(c.conceitoFinalFaixa), '') +
          '</tr>';
      }).join('');
    }
    document.getElementById('modalKpi').classList.add('open');
    var modalHead = document.getElementById('kpiModalHead');
    bindTableSort(modalHead ? modalHead.closest('table') : null, 'modal');
  }

  function openKpiModal(action, rows) {
    var title = 'Detalhe';
    var subtitle = '';
    var list = [];

    if (action === 'nota-5') {
      title = 'Cursos com Nota 5';
      list = rows.filter(function (c) { return toNum(c.conceitoFinalFaixa) === 5; });
      subtitle = list.length + ' curso(s) com Conceito Final Faixa = 5';
    } else if (action === 'nota-4') {
      title = 'Cursos com Nota 4';
      list = rows.filter(function (c) { return toNum(c.conceitoFinalFaixa) === 4; });
      subtitle = list.length + ' curso(s) com Conceito Final Faixa = 4';
    } else if (action === 'nota-lt4') {
      title = 'Cursos com Nota < 4';
      list = rows.filter(function (c) {
        var v = toNum(c.conceitoFinalFaixa);
        return v != null && v < 4;
      });
      subtitle = list.length + ' curso(s) com Conceito Final Faixa menor que 4';
    } else if (action === 'detail-continuo' || action === 'detail-faixa') {
      title = action === 'detail-continuo' ? 'Conceito Final Contínuo' : 'Conceito Final Faixa';
      list = rows.slice();
      subtitle = list.length + ' curso(s) no recorte selecionado';
    } else {
      return;
    }

    showCoursesModal(title, subtitle, list);
  }

  function closeKpiModal() {
    document.getElementById('modalKpi').classList.remove('open');
  }

  function renderYearBars(rows) {
    var counts = {};
    rows.forEach(function (c) {
      if (c.anoVisita == null || c.anoVisita === '') return;
      var y = String(c.anoVisita);
      counts[y] = (counts[y] || 0) + 1;
    });
    var years = Object.keys(counts).sort();
    if (!years.length) {
      el.yearBars.innerHTML = '<p class="empty-soft">Sem avaliações no recorte atual.</p>';
      return;
    }
    var max = Math.max.apply(null, years.map(function (y) { return counts[y]; }));
    el.yearBars.innerHTML = years.map(function (y) {
      var n = counts[y];
      var w = max ? Math.round((n / max) * 100) : 0;
      return '<div class="year-row"><span class="y">' + escapeHtml(y) + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + w + '%"></div></div>' +
        '<span class="n">' + n + '</span></div>';
    }).join('');
  }

  function collectIndicatorStats(rows) {
    var stats = {};
    INDICADORES.forEach(function (ind) {
      stats[ind] = { count: 0, hitMax: 0, hitMin: 0, values: [] };
    });
    rows.forEach(function (c) {
      var inds = c.indicadores || {};
      INDICADORES.forEach(function (ind) {
        var v = toNum(inds[ind]);
        if (v == null) return;
        stats[ind].count += 1;
        stats[ind].values.push(v);
      });
    });

    var globalMax = null;
    var globalMin = null;
    Object.keys(stats).forEach(function (ind) {
      stats[ind].values.forEach(function (v) {
        if (globalMax == null || v > globalMax) globalMax = v;
        if (globalMin == null || v < globalMin) globalMin = v;
      });
    });

    Object.keys(stats).forEach(function (ind) {
      stats[ind].values.forEach(function (v) {
        if (globalMax != null && nearlyEqual(v, globalMax)) stats[ind].hitMax += 1;
        if (globalMin != null && nearlyEqual(v, globalMin)) stats[ind].hitMin += 1;
      });
    });

    return {
      globalMax: globalMax,
      globalMin: globalMin,
      items: Object.keys(stats).map(function (ind) {
        return {
          indicador: ind,
          count: stats[ind].count,
          hitMax: stats[ind].hitMax,
          hitMin: stats[ind].hitMin
        };
      }).filter(function (x) { return x.count > 0; })
    };
  }

  function formatIndicatorScore(n) {
    if (n == null) return '—';
    if (Math.abs(n - Math.round(n)) < 0.001) return String(Math.round(n));
    return formatScore(n);
  }

  function courseIndicatorMap(rows) {
    var map = {};
    rows.forEach(function (c) {
      var inds = c.indicadores || {};
      INDICADORES.forEach(function (ind) {
        var v = toNum(inds[ind]);
        if (v == null) return;
        if (!map[ind]) map[ind] = [];
        map[ind].push(v);
      });
    });
    return map;
  }

  function indicatorPlainList(codes, scoreOf) {
    return codes.map(function (ind) {
      var name = indicatorName(ind);
      var score = scoreOf ? scoreOf(ind) : '';
      return '<div class="ind-plain" title="' + escapeAttr(name ? ind + ' — ' + name : ind) + '">' +
        '<span class="low3-name"><strong>' + escapeHtml(ind) + '</strong>' +
        (name ? '<span>' + escapeHtml(name) + '</span>' : '') + '</span>' +
        (score ? '<span class="low3-meta is-curso">' + score + '</span>' : '') +
        '</div>';
    }).join('');

  function renderCourseIndicatorLists(rows) {
    var map = courseIndicatorMap(rows);
    var codes = Object.keys(map);
    if (!codes.length) {
      if (el.topSubtitle) el.topSubtitle.textContent = 'Indicadores deste curso na nota mais alta.';
      if (el.lowSubtitle) el.lowSubtitle.textContent = 'Indicadores deste curso na nota mais baixa.';
      el.topIndicators.innerHTML = '<p class="empty-soft">Sem notas de indicadores.</p>';
      el.lowIndicators.innerHTML = '<p class="empty-soft">Sem notas de indicadores.</p>';
      return;
    }
    var max = null;
    var min = null;
    codes.forEach(function (ind) {
      map[ind].forEach(function (v) {
        if (max == null || v > max) max = v;
        if (min == null || v < min) min = v;
      });
    });
    var tops = codes.filter(function (ind) {
      return map[ind].some(function (v) { return nearlyEqual(v, max); });
    }).sort(indicatorSort);
    var lows = codes.filter(function (ind) {
      return map[ind].some(function (v) { return nearlyEqual(v, min); });
    }).sort(indicatorSort);
    if (el.topSubtitle) el.topSubtitle.textContent = 'Nota ' + formatIndicatorScore(max) + ' neste curso.';
    if (el.lowSubtitle) el.lowSubtitle.textContent = 'Nota ' + formatIndicatorScore(min) + ' neste curso.';
    el.topIndicators.innerHTML = tops.length
      ? indicatorPlainList(tops)
      : '<p class="empty-soft">Nenhum indicador.</p>';
    el.lowIndicators.innerHTML = lows.length
      ? indicatorPlainList(lows)
      : '<p class="empty-soft">Nenhum indicador.</p>';
  }

  function renderCourseBelow3(rows) {
    if (el.belowSubtitle) el.belowSubtitle.textContent = 'Indicadores deste curso com nota inferior a 3.';
    var map = courseIndicatorMap(rows);
    var codes = Object.keys(map).filter(function (ind) {
      return map[ind].some(function (v) { return v < 3; });
    }).sort(indicatorSort);
    el.vizAbaixo3.innerHTML = codes.length
      ? indicatorPlainList(codes, function (ind) {
          var lows = map[ind].filter(function (v) { return v < 3; });
          var seen = {};
          return lows.filter(function (v) {
            var key = formatIndicatorScore(v);
            if (seen[key]) return false;
            seen[key] = true;
            return true;
          }).map(formatIndicatorScore).join(' · ');
        })
      : '<p class="empty-soft">Nenhum indicador abaixo de 3 neste curso.</p>';
  }

  function renderIndicatorExtremes(rows) {
    if (getFilters().cursoCodigo) {
      renderCourseIndicatorLists(rows);
      return;
    }
    var packed = collectIndicatorStats(rows);
    var list = packed.items;
    if (!list.length || packed.globalMax == null) {
      if (el.topSubtitle) el.topSubtitle.textContent = 'Os que mais atingiram a maior nota do recorte.';
      if (el.lowSubtitle) el.lowSubtitle.textContent = 'Os que mais atingiram a menor nota do recorte.';
      el.topIndicators.innerHTML = '<p class="empty-soft">Sem notas de indicadores.</p>';
      el.lowIndicators.innerHTML = '<p class="empty-soft">Sem notas de indicadores.</p>';
      return;
    }

    function rank(hitKey) {
      return list.filter(function (x) { return x[hitKey] > 0; })
        .map(function (x) {
          var pct = x.count ? (x[hitKey] / x.count) * 100 : 0;
          return { ind: x.indicador, value: pct, hits: x[hitKey], meta: x[hitKey] + ' · ' + formatPct(pct) };
        })
        .sort(function (a, b) { return b.value - a.value || b.hits - a.hits || indicatorSort(a.ind, b.ind); })
        .slice(0, 12);
    }

    var tops = rank('hitMax');
    var lows = rank('hitMin');
    if (el.topSubtitle) el.topSubtitle.textContent = 'Nota ' + formatScore(packed.globalMax) + ' · até 12 indicadores, dos mais frequentes.';
    if (el.lowSubtitle) el.lowSubtitle.textContent = 'Nota ' + formatScore(packed.globalMin) + ' · até 12 indicadores, dos mais frequentes.';
    el.topIndicators.innerHTML = tops.length
      ? scoreBarList(tops)
      : '<p class="empty-soft">Nenhum indicador.</p>';
    el.lowIndicators.innerHTML = lows.length
      ? scoreBarList(lows)
      : '<p class="empty-soft">Nenhum indicador.</p>';
  }

        td(d.qtdGt3Cc, 'num') +

        td(formatPct(d.pLt2023), 'num') +
        td(d.qGt2023, 'num') +

  function th(text, title) {
    var cls = 'sortable' + (title ? ' has-tip' : '');
    var tip = title ? ' title="' + escapeAttr(title) + '"' : '';
    return '<th class="' + cls + '"' + tip + '>' + escapeHtml(text) + '</th>';
  }
  function td(content, cls, sortValue) {
    var attr = sortValue != null && sortValue !== ''
      ? ' data-value="' + escapeAttr(String(sortValue)) + '"'
      : '';
    return '<td class="' + (cls || '') + '"' + attr + '>' + (content == null ? '—' : content) + '</td>';
  }

  function bindTableSort(table, panelKey) {
    if (!table || !table.tHead || !table.tBodies[0]) return;
    var headers = table.tHead.rows[0] ? table.tHead.rows[0].cells : [];
    Array.prototype.forEach.call(headers, function (header, index) {
      header.classList.add('sortable');
      header.tabIndex = 0;
      var run = function () { toggleColumnSort(table, panelKey, index); };
      header.addEventListener('click', run);
      header.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter' && ev.key !== ' ') return;
        ev.preventDefault();
        run();
      });
    });
    var saved = state.sort[panelKey];
    if (saved && headers[saved.index]) applyColumnSort(table, saved.index, saved.dir);
  }

  function toggleColumnSort(table, panelKey, index) {
    var current = state.sort[panelKey];
    var dir = current && current.index === index && current.dir === 'asc' ? 'desc' : 'asc';
    state.sort[panelKey] = { index: index, dir: dir };
    applyColumnSort(table, index, dir);
  }

  function applyColumnSort(table, index, dir) {
    var headers = table.tHead.rows[0].cells;
    Array.prototype.forEach.call(headers, function (header, i) {
      header.classList.remove('sort-asc', 'sort-desc');
      if (i === index) header.classList.add(dir === 'asc' ? 'sort-asc' : 'sort-desc');
    });
    var body = table.tBodies[0];
    var rows = Array.prototype.filter.call(body.rows, function (row) {
      return !(row.cells.length === 1 && row.cells[0].colSpan > 1);
    });
    rows.sort(function (a, b) {
      return compareSortValues(cellSortValue(a.cells[index]), cellSortValue(b.cells[index]), dir);
    });
    rows.forEach(function (row) { body.appendChild(row); });
  }

  function cellSortValue(cell) {
    if (!cell) return '';
    if (cell.hasAttribute('data-value')) return cell.getAttribute('data-value');
    return (cell.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function compareSortValues(va, vb, dir) {
    var aEmpty = va === '' || va === '—' || va == null;
    var bEmpty = vb === '' || vb === '—' || vb == null;
    if (aEmpty && bEmpty) return 0;
    if (aEmpty) return 1;
    if (bEmpty) return -1;
    var ia = indicatorRank(va);
    var ib = indicatorRank(vb);
    var cmp;
    if (ia != null && ib != null) cmp = ia - ib;
    else {
      var na = toSortNumber(va);
      var nb = toSortNumber(vb);
      if (na != null && nb != null) cmp = na - nb;
      else cmp = String(va).localeCompare(String(vb), 'pt-BR', { sensitivity: 'base', numeric: true });
    }
    return dir === 'asc' ? cmp : -cmp;
  }

  function indicatorRank(value) {
    var match = String(value).trim().match(/^(\d+)\.(\d+)$/);
    if (!match) return null;
    return Number(match[1]) * 1000 + Number(match[2]);
  }

  function toSortNumber(value) {
    var text = String(value).replace(/%/g, '').replace(/\s/g, '').replace(',', '.');
    if (!text || text === '—' || text === '-') return null;
    var n = Number(text);
    return isFinite(n) ? n : null;
  }

  function abbreviateCourse(name) {
    var raw = String(name || '').trim();
    if (!raw) return 'Curso';
    var known = {
      'analise e desenvolvimento de sistemas': 'ADS',
      'arquitetura e urbanismo': 'Arq. Urb.',
      'ciencia da computacao': 'Ciên. Comp.',
      'ciencias contabeis': 'Ciên. Cont.',
      'design de interiores': 'Design Int.',
      'design grafico': 'Design Gráf.',
      'gestao de recursos humanos': 'GRH',
      'gestao hospitalar': 'Gest. Hosp.',
      'automacao industrial': 'Autom. Ind.',
      'seguranca publica': 'Seg. Púb.',
      'educacao fisica': 'Ed. Física',
      'servicos juridicos': 'Serv. Jur.'
    };
    var hit = known[foldName(raw)];
    if (hit) return hit;
    var stop = { de: 1, da: 1, do: 1, das: 1, dos: 1, e: 1 };
    var words = raw.split(/\s+/).filter(function (word) { return !stop[foldName(word)]; });
    if (!words.length) return raw;
    if (words.length === 1) return words[0];
    if (words.length >= 3) {
      return words.map(function (word) { return word.charAt(0).toUpperCase(); }).join('');
    }
    return words.map(function (word) {
      if (foldName(word).length <= 5) return word;
      return word.slice(0, 4).replace(/[.\s]+$/, '') + '.';
    }).join(' ');
  }

  function foldName(value) {
    return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  }
  function emptyRow(cols) {
    return '<tr><td colspan="' + cols + '" style="text-align:center;color:#5B6B7F;padding:1.5rem;">Nenhum registro para o filtro atual.</td></tr>';
  }

  function faixaBadge(v) {
    if (v == null || v === '') return '—';
    var n = Number(v);
    var cls = n === 5 ? 'badge-5' : n === 4 ? 'badge-4' : 'badge-low';
    return '<span class="badge ' + cls + '">' + escapeHtml(String(v)) + '</span>';
  }

  function scoreClass(v) {
    if (v == null) return '';
    if (v >= 4) return 'score-cell score-ok';
    if (v >= 3) return 'score-cell score-warn';
    return 'score-cell score-bad';
  }

  function readExcelFile(file) {
    if (!/\.xlsx?$/i.test(file.name)) {
      toast('Envie um arquivo Excel (.xlsx).', 'error');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      var result = String(reader.result || '');
      state.excelBase64 = result;
      state.excelName = file.name;
      el.fileNameLabel.textContent = 'Arquivo: ' + file.name + ' (' + formatBytes(file.size) + ')';
    };
    reader.onerror = function () { toast('Não foi possível ler o arquivo.', 'error'); };
    reader.readAsDataURL(file);
  }

    if (state.activeTab === 'excel') {
      if (!state.excelBase64) {
        toast('Selecione uma planilha Excel.', 'error');
        return;
      }
      setLoading(true);
      var strategy = document.getElementById('importStrategy').value;
      google.script.run
        .withSuccessHandler(function (res) {
          setLoading(false);
          if (!res || !res.ok) {
            toast((res && res.error) || 'Falha na importação.', 'error');
            return;
          }
          state.cursos = prepareCursos((res.data && res.data.cursos) || []);
          state.updatedAt = res.data && res.data.updatedAt;
          populateFilterOptions();
          renderAll();
          closeModal();
          toast(
            buildImportMessage_(res),
            (res.diagnostics && res.diagnostics.withFaixa === 0 && res.diagnostics.withIndicadores === 0)
              ? 'error'
              : 'success'
          );
        })
        .withFailureHandler(function (err) {
          setLoading(false);
          toast(String(err), 'error');
        })
        .importExcelBase64(state.excelBase64, state.excelName, strategy);
      return;
    }

    var curso = {
      codigo: document.getElementById('mCodigo').value.trim(),
      curso: document.getElementById('mCurso').value.trim(),
      unidade: document.getElementById('mUnidade').value.trim(),
      anoVisita: document.getElementById('mAno').value,

      conceitoFinalContinuo: document.getElementById('mContinuo').value,
      conceitoFinalFaixa: document.getElementById('mFaixa').value,

    };
    if (!curso.codigo || !curso.curso || !curso.unidade || !curso.anoVisita || !curso.atoRegulatorio) {
      toast('Preencha os campos obrigatórios do curso.', 'error');

      curso.indicadores[input.getAttribute('data-ind')] = input.value === '' ? null : Number(input.value);
    });

    setLoading(true);
    google.script.run
      .withSuccessHandler(function (res) {
        setLoading(false);
        if (!res || !res.ok) {
          toast((res && res.error) || 'Falha ao salvar.', 'error');
          return;
        }
        state.cursos = prepareCursos((res.data && res.data.cursos) || []);
        state.updatedAt = res.data && res.data.updatedAt;
        populateFilterOptions();
        renderAll();
        closeModal();
        toast('Curso salvo com sucesso.', 'success');
      })
      .withFailureHandler(function (err) {
        setLoading(false);
        toast(String(err), 'error');
      })
      .saveCursoManual(curso);
  }

  /* ===== helpers ===== */
  function notaCount(c) {
    var n = 0;
    var inds = (c && c.indicadores) || {};
    Object.keys(inds).forEach(function (k) {
      if (inds[k] != null && inds[k] !== '') n++;
    });
    return n;
  }

  function keepScoredCursos(list) {
    return (list || []).filter(function (c) { return notaCount(c) >= 10; });
  }

  function toNum(v) {
    if (v === null || v === undefined || v === '') return null;
    var n = Number(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  }

  function avg(arr) {
    var nums = arr.map(toNum).filter(function (v) { return v != null; });
    if (!nums.length) return null;
    return nums.reduce(function (a, b) { return a + b; }, 0) / nums.length;
  }

  function modeNumber(arr) {
    var counts = {};
    var best = null;
    var bestN = 0;
    arr.forEach(function (v) {
      var n = toNum(v);
      if (n == null) return;
      var k = String(n);
      counts[k] = (counts[k] || 0) + 1;
      if (counts[k] > bestN) {
        bestN = counts[k];
        best = n;
      }
    });
    return best;
  }

  function formatScore(v) {
    if (v == null || v === '') return '—';
    var n = Number(v);
    if (!isFinite(n)) return '—';
    return (Math.round(n * 100) / 100).toFixed(2).replace('.', ',');
  }

  function formatPct(v) {
    if (v == null || !isFinite(v)) return '—';
    return (Math.round(v * 10) / 10).toFixed(1).replace('.', ',') + '%';
  }

  function pctLabel(part, total) {
    if (!total) return '0% do total';
    return ((part / total) * 100).toFixed(1).replace('.', ',') + '% do total';
  }

  function nearlyEqual(a, b) {
    return Math.abs(a - b) < 0.0001;
  }

  function indicatorSort(a, b) {
    var pa = a.split('.').map(Number);
    var pb = b.split('.').map(Number);
    return (pa[0] - pb[0]) || (pa[1] - pb[1]);
  }

  function formatDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleString('pt-BR');
    } catch (e) {
      return iso;
    }
  }

  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function buildImportMessage_(res) {
    var d = res.diagnostics || {};
    var parts = [];
    parts.push((res.imported || res.total || 0) + ' curso(s)');
    if (d.withFaixa != null) parts.push(d.withFaixa + ' com conceito faixa');
    if (d.withIndicadores != null) parts.push(d.withIndicadores + ' com indicadores');
    if (res.removedDuplicates > 0) parts.push(res.removedDuplicates + ' duplicata(s) excluída(s)');
    if (res.removedSparse > 0) parts.push(res.removedSparse + ' com menos de 10 notas removido(s)');
    if (d.refErrors) parts.push(d.refErrors + ' células #REF! ignoradas');
    var msg = 'Importação: ' + parts.join(' · ');
    if (d.withFaixa === 0 && d.withIndicadores === 0) {
      msg += '. A planilha não trouxe notas (só metadados ou #REF!). Exporte as abas com Colar especial → Valores.';
    }
    return msg;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function escapeAttr(s) {
    return escapeHtml(s).replace(/'/g, '&#39;');
  }

  // For local preview without google.script
  if (typeof google === 'undefined' || !google.script) {
    window.google = {
      script: {
        run: {
          withSuccessHandler: function (cb) {
            this._ok = cb;
            return this;
          },
          withFailureHandler: function (cb) {
            this._err = cb;
            return this;
          },
          getDashboardData: function () {
            var self = this;
            setTimeout(function () {
              self._ok({
                ok: true,
                data: { version: 1, updatedAt: new Date().toISOString(), cursos: DEMO_CURSOS },
                indicadores: INDICADORES
              });
            }, 200);
          },
          importExcelBase64: function () {
            this._err('Importação Excel disponível apenas no Google Apps Script.');
          },
          saveCursoManual: function (curso) {
            DEMO_CURSOS.push(curso);
            this._ok({ ok: true, data: { cursos: DEMO_CURSOS, updatedAt: new Date().toISOString() }, total: DEMO_CURSOS.length });
          },
          clearAllData: function () {
            DEMO_CURSOS.length = 0;
            this._ok({ ok: true, total: 0, data: { cursos: [], updatedAt: new Date().toISOString() } });
          }
        }
      }
    };
  }

  var DEMO_CURSOS = [];

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
